<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama UML - Proxy</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #ffffff; }
        svg { display: block; width: 1180px; max-width: 100%; height: auto; }
        .nome { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; fill: #2d3142; }
        .membro { font-family: Consolas, monospace; font-size: 12px; fill: #2d3142; }
        .tag { font-family: Consolas, monospace; font-size: 11px; text-anchor: middle; fill: #4f5d75; }
    </style>
</head>
<body>
<svg viewBox="0 0 1180 710" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagrama-uml-title diagrama-uml-desc">
    <title id="diagrama-uml-title">Diagrama de classes do padrão Proxy</title>
    <desc id="diagrama-uml-desc">PortalDocumentos usa a interface ServicoDocumentos, realizada por ServicoDocumentosReal e por ServicoDocumentosProxy, que controla o acesso ao serviço real com base em Usuario.</desc>
    <defs>
        <marker id="heranca" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,16 6,0 12" fill="#ffffff" stroke="#2d3142"/></marker>
        <marker id="associacao" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#4f5d75"/></marker>
        <marker id="agregacao" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 5,9 0,18 5,9 10" fill="#ffffff" stroke="#2d3142"/></marker>
        <marker id="composicao" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 5,9 0,18 5,9 10" fill="#2d3142" stroke="#2d3142"/></marker>
    </defs>
    <rect width="1180" height="710" fill="#ffffff"/>

    <line x1="480" y1="90" x2="640" y2="90" stroke="#4f5d75" marker-end="url(#associacao)"/>
    <rect x="486" y="68" width="16" height="16" fill="#ffffff"/><text x="488" y="80" class="membro">1</text>
    <rect x="616" y="68" width="16" height="16" fill="#ffffff"/><text x="618" y="80" class="membro">1</text>
    <path d="M320 300 V220 H800 V120" fill="none" stroke="#2d3142" stroke-dasharray="5,4" marker-end="url(#heranca)"/>
    <path d="M930 300 V120" fill="none" stroke="#2d3142" stroke-dasharray="5,4" marker-end="url(#heranca)"/>
    <line x1="600" y1="360" x2="720" y2="360" stroke="#4f5d75" marker-end="url(#associacao)"/>
    <rect x="604" y="338" width="16" height="16" fill="#ffffff"/><text x="606" y="350" class="membro">1</text>
    <rect x="696" y="338" width="16" height="16" fill="#ffffff"/><text x="698" y="350" class="membro">1</text>
    <rect x="640" y="367" width="40" height="17" fill="#ffffff"/><text x="660" y="380" class="tag">real</text>
    <line x1="320" y1="440" x2="320" y2="530" stroke="#4f5d75" marker-end="url(#associacao)"/>
    <rect x="328" y="508" width="16" height="16" fill="#ffffff"/><text x="330" y="520" class="membro">1</text>

    <g id="portal-documentos">
        <rect x="40" y="40" width="440" height="100" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M46 40 H474 Q480 40 480 46 V76 H40 V46 Q40 40 46 40" fill="#f1f3f5"/>
        <text x="260" y="63" class="nome">PortalDocumentos</text>
        <line x1="40" y1="76" x2="480" y2="76" stroke="#bfc0c0"/>
        <text x="54" y="96" class="membro">- servico: ServicoDocumentos {readOnly}</text>
        <line x1="40" y1="108" x2="480" y2="108" stroke="#bfc0c0"/>
        <text x="54" y="128" class="membro">+ exibir(String): String</text>
    </g>
    <g id="servico-documentos">
        <rect x="640" y="40" width="480" height="80" rx="6" fill="#ffffff" stroke="#eb6c36"/>
        <rect x="640" y="40" width="480" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <path d="M646 40 H1114 Q1120 40 1120 46 V88 H640 V46 Q640 40 646 40" fill="#fff1eb"/>
        <text x="880" y="59" class="tag">«interface»</text>
        <text x="880" y="78" class="nome">ServicoDocumentos</text>
        <line x1="640" y1="88" x2="1120" y2="88" stroke="#bfc0c0"/>
        <text x="654" y="108" class="membro">+ ler(codigo: String): String</text>
    </g>
    <g id="servico-documentos-proxy">
        <rect x="40" y="300" width="560" height="140" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M46 300 H594 Q600 300 600 306 V336 H40 V306 Q40 300 46 300" fill="#f1f3f5"/>
        <text x="320" y="323" class="nome">ServicoDocumentosProxy</text>
        <line x1="40" y1="336" x2="600" y2="336" stroke="#bfc0c0"/>
        <text x="54" y="356" class="membro">- real: ServicoDocumentos {readOnly}</text>
        <text x="54" y="376" class="membro">- usuario: Usuario {readOnly}</text>
        <text x="54" y="396" class="membro">- cache: Map&lt;String, String&gt; {readOnly}</text>
        <line x1="40" y1="408" x2="600" y2="408" stroke="#bfc0c0"/>
        <text x="54" y="428" class="membro">+ ler(String): String</text>
    </g>
    <g id="servico-documentos-real">
        <rect x="720" y="300" width="420" height="160" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M726 300 H1134 Q1140 300 1140 306 V336 H720 V306 Q720 300 726 300" fill="#f1f3f5"/>
        <text x="930" y="323" class="nome">ServicoDocumentosReal</text>
        <line x1="720" y1="336" x2="1140" y2="336" stroke="#bfc0c0"/>
        <text x="734" y="356" class="membro">- documentos: Map&lt;String, String&gt;</text>
        <text x="734" y="376" class="membro">- totalLeituras: int</text>
        <line x1="720" y1="388" x2="1140" y2="388" stroke="#bfc0c0"/>
        <text x="734" y="408" class="membro">+ adicionar(String, String): void</text>
        <text x="734" y="428" class="membro">+ ler(String): String</text>
        <text x="734" y="448" class="membro">+ getTotalLeituras(): int</text>
    </g>
    <g id="usuario">
        <rect x="40" y="530" width="560" height="140" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M46 530 H594 Q600 530 600 536 V566 H40 V536 Q40 530 46 530" fill="#f1f3f5"/>
        <text x="320" y="553" class="nome">Usuario</text>
        <line x1="40" y1="566" x2="600" y2="566" stroke="#bfc0c0"/>
        <text x="54" y="586" class="membro">- nome: String {readOnly}</text>
        <text x="54" y="606" class="membro">- administrador: boolean {readOnly}</text>
        <line x1="40" y1="618" x2="600" y2="618" stroke="#bfc0c0"/>
        <text x="54" y="638" class="membro">+ getNome(): String</text>
        <text x="54" y="658" class="membro">+ isAdministrador(): boolean</text>
    </g>
</svg>
</body>
</html>
